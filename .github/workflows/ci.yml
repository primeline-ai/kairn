name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Three operating systems on purpose. kairn is published to PyPI and gets
    # installed by strangers on machines we do not own; an ubuntu-only matrix
    # certifies exactly one of them. This suite is filesystem-heavy - tempdirs,
    # SQLite, and a CLI shelled out via subprocess - which is precisely where
    # platforms diverge: macOS puts the tempdir under /var/folders/..., never
    # /tmp, and Windows shares neither that path shape nor POSIX file locking.
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # The full suite finishes in ~25s and exits on its own; a hang at
    # interpreter shutdown (leaked non-daemon thread) is a regression this
    # timeout is meant to catch, not accommodate.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,team]"
      - name: Test
        run: pytest tests/ -q

  bundle:
    # The MCP bundle is a shipped artifact that the suite above never touches:
    # pytest is confined to testpaths = ["tests"], so packaging/mcpb/ is invisible
    # to it. Without this job a schema-invalid manifest, a syntax error in the
    # entry point, or a version that drifted away from the PyPI release would all
    # reach users, because nothing here ever builds the thing the release ships.
    name: mcpb bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        # Not preinstalled on ubuntu-latest - the runner image lists pipx and
        # miniconda, not uv. The entry point is launched with `uv run`, so
        # without this the smoke step dies on FileNotFoundError and the gate
        # this job exists to be can never go green.
        uses: astral-sh/setup-uv@v5
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Version parity and workspace resolution
        # Deliberately outside the root testpaths, so they never slow the matrix.
        run: pytest packaging/mcpb/tests -q

      - name: Pack the bundle
        # `mcpb pack` validates manifest.json against the v0.4 schema and fails
        # the build if it does not conform, so this is the schema gate too.
        # Pinned to the major this was developed against (2.x, latest 2.1.2). An
        # unpinned packer could change validation or ignore semantics with no
        # commit here, turning this into a gate against a different schema than
        # the manifest targets. Pinning to the WRONG major is the same bug with
        # the opposite sign: "^1" silently resolves to a superseded release, and
        # npx fails quietly enough that a careless grep reads it as success.
        run: npx -y "@anthropic-ai/mcpb@^2" pack packaging/mcpb "$RUNNER_TEMP/kairn.mcpb"

      - name: The bundle must not ship build or test artifacts
        # .mcpbignore is the only thing keeping a local .venv, bytecode tagged
        # for one interpreter, and the tests out of a user download. An ignore
        # file that silently stops matching is invisible otherwise, so assert on
        # the packed contents rather than trusting it.
        run: |
          unzip -Z1 "$RUNNER_TEMP/kairn.mcpb" | sort | tee /tmp/contents.txt
          if grep -qE '__pycache__|\.pyc$|^tests/|^\.venv/' /tmp/contents.txt; then
            echo "::error::bundle contains files that must not be distributed"
            exit 1
          fi
          for required in manifest.json pyproject.toml src/server.py uv.lock; do
            grep -qx "$required" /tmp/contents.txt || {
              echo "::error::bundle is missing $required"; exit 1; }
          done

      - name: Is the pinned release on PyPI yet?
        # The bundle pins kairn-ai to an exact version and the parity test forces
        # every site to move in one commit. So the release-prep commit that bumps
        # to the next version names a release that does not exist yet, and the
        # runtime smoke below cannot resolve it. That is a real state, not a
        # failure: pack, schema and parity still gate it. Skipping loudly beats
        # a red build on every PR between the bump and the publish.
        id: pypi
        run: |
          version=$(python -c "import json;print(json.load(open('packaging/mcpb/manifest.json'))['version'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/kairn-ai/$version/json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::kairn-ai $version is not on PyPI (HTTP $code) - runtime smoke skipped until the release is published"
          fi

      - name: The packed bundle must actually start and answer MCP
        # Packing proves the archive is well formed, not that it runs. This
        # unpacks it somewhere else entirely and drives a real stdio handshake,
        # so a bundle that validates but cannot serve fails here instead of on a
        # user's machine.
        if: steps.pypi.outputs.published == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/kairn.mcpb" -d "$RUNNER_TEMP/unpacked"
          python packaging/mcpb/tests/smoke_stdio.py "$RUNNER_TEMP/unpacked"

      - name: server.json must match the published release asset
        # The parity test forces server.json's version and asset URL to move
        # with the release, but nothing binds the HASH. So a release-prep bump
        # could land on main with the URL at the new version and fileSha256
        # still the previous digest, fully green, because only the manually
        # dispatched publish workflow ever compares them.
        #
        # Same release-order window as the PyPI check above: right after a bump
        # the asset does not exist yet. That is a loud skip, not a failure.
        run: |
          url=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          want=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['fileSha256'])")
          code=$(curl -sL -o /tmp/asset.mcpb -w '%{http_code}' "$url")
          if [ "$code" != "200" ]; then
            echo "::warning::release asset not published yet (HTTP $code) - hash check skipped: $url"
            exit 0
          fi
          got=$(sha256sum /tmp/asset.mcpb | cut -d' ' -f1)
          echo "want: $want"
          echo "got:  $got"
          [ "$want" = "$got" ] || {
            echo "::error::server.json fileSha256 does not match the published asset"; exit 1; }

      - name: Publish the bundle as a build artifact
        # Otherwise the job packs the thing and throws it away, and there is no
        # path from a green build to a file anyone can install.
        uses: actions/upload-artifact@v4
        with:
          name: kairn-${{ steps.pypi.outputs.version }}.mcpb
          path: ${{ runner.temp }}/kairn.mcpb
          if-no-files-found: error
