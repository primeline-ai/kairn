# Publishes on a pushed v* tag through PyPI Trusted Publishing
# (short-lived OIDC token, no stored secret). The tag must match the package version.
# A version number can never be re-uploaded, so test and build run before the upload job.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]
          source = Path("src/kairn/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', source, re.MULTILINE)
          if match is None:
              print("::error::Could not read __version__ from src/kairn/__init__.py")
              sys.exit(1)
          source_version = match.group(1)
          if tag != package_version or tag != source_version:
              print(
                  f"::error::Tag version {tag} must match pyproject.toml "
                  f"({package_version}) and __version__ ({source_version})"
              )
              sys.exit(1)
          PY

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.12.23"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "$(ls dist/*.whl)[dev,team]"

      - name: Verify installed wheel import
        run: |
          python -c "import kairn, sys; f = kairn.__file__; print(f); sys.exit(0 if 'site-packages' in f else 1)"

      - name: Test
        run: pytest tests/ -q -o pythonpath= --deselect tests/test_p5_review_f3_f6_f7.py::test_positive_control_imports_come_from_this_worktree

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/kairn-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
