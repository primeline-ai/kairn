name: Publish to MCP Registry

# The registry namespace `io.github.primeline-ai/*` is owned by the GitHub ORG,
# not by any one person, so an interactive `mcp-publisher login github` as an
# individual cannot claim it. The documented alternative is to publish from a
# GitHub Action running on that org's repository, which is what this workflow is
# for: the OIDC token proves the org identity without a stored secret.
#
# Not automatic on release. A registry entry is public and hard to withdraw, and
# the server.json it publishes names an exact release asset and its SHA256 - so
# it must be run deliberately, after that asset exists and has been verified.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        # This binary is handed an OIDC token that can publish under
        # io.github.primeline-ai/*, so it is verified before it runs. A tag pin
        # alone is not enough: GitHub release assets are mutable, so the same
        # tag can serve different bytes later. The upstream release ships a
        # checksums file; the expected digest is committed here rather than read
        # from that file alone, because fetching both from the same mutable
        # release would let one attacker edit both.
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}"
          curl -sL --fail -o publisher.tar.gz "$base/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c - || {
            echo "::error::mcp-publisher checksum mismatch - refusing to run it"; exit 1; }
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --help > /dev/null
        env:
          # Pinned deliberately. An unpinned publisher could change validation or
          # auth behaviour between runs with no commit here.
          PUBLISHER_VERSION: 1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

      - name: The release asset must exist and match the hash in server.json
        # The registry fetches this URL and verifies the hash itself, so a
        # mismatch would fail server-side with a less obvious message. Checking
        # here means a stale server.json fails on the file rather than on the
        # registry's rejection.
        run: |
          url=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          want=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['fileSha256'])")
          curl -sL --fail -o /tmp/asset.mcpb "$url"
          got=$(sha256sum /tmp/asset.mcpb | cut -d' ' -f1)
          echo "url:  $url"
          echo "want: $want"
          echo "got:  $got"
          [ "$want" = "$got" ] || { echo "::error::server.json fileSha256 does not match the published asset"; exit 1; }

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        # Proves this run belongs to the primeline-ai org, which is what the
        # io.github.primeline-ai namespace requires.
        run: ./mcp-publisher login github-oidc

      - name: Publish
        id: publish
        run: ./mcp-publisher publish

      - name: Confirm the entry is actually queryable
        # Publishing returning success is not the same as the entry being
        # readable, so this asks the public API rather than trusting the exit
        # code of the step above.
        #
        # Deliberately a WARNING and not a failure. The registry refuses a
        # duplicate version, so once Publish has succeeded there is no second
        # green run available: a transient blip here would otherwise leave a
        # live entry with a permanently red workflow and no way to tell
        # "not published" from "published, confirmation flaked". The publish
        # already succeeded by this point; this step reports, it does not gate.
        if: always() && steps.publish.outcome == 'success'
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=kairn" || true)
            if echo "$body" | grep -q 'io.github.primeline-ai/kairn'; then
              echo "$body" | head -c 600; echo; echo "entry is live"; exit 0
            fi
            echo "not visible yet, attempt $i"; sleep 10
          done
          echo "::warning::publish succeeded but the entry is not queryable yet - check https://registry.modelcontextprotocol.io/v0/servers?search=kairn before re-running, because a duplicate version is refused"
